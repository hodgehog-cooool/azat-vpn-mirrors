<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AZAT VPN — панель управления</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#101A2E;color:#F2F6FA;font:15px/1.6 Inter,system-ui,sans-serif}
.box{max-width:420px;padding:32px;border:1px solid #354862;border-radius:24px;background:#16223B}
h1{font:600 22px Sora,system-ui,sans-serif;margin:0 0 8px}
p{color:#A8B6C8;margin:0 0 20px}
a{color:#38E0E0;text-decoration:none}
</style>
</head>
<body>
<div class="box">
<h1>AZAT VPN</h1>
<p id="msg">Ищем рабочий вход в панель управления…</p>
<a id="link" href="https://azatn.ru/" hidden>Открыть панель вручную</a>
</div>
<script>
fetch('bootstrap.json?t='+Date.now())
 .then(r=>r.json())
 .then(d=>{
   const bases=(d.live_api_bases&&d.live_api_bases.length)?d.live_api_bases:(d.api_bases||[]);
   const good=bases.filter(b=>b && b.indexOf('azatn.ru')<0);
   const base=good[0]||bases[0]||'https://azatn.ru';
   const a=document.getElementById('link');
   a.href=base.replace(/\/$/,'')+'/'; a.hidden=false;
   document.getElementById('msg').textContent='Перенаправляем на рабочий вход…';
   location.replace(a.href);
 })
 .catch(()=>{document.getElementById('msg').textContent='Не удалось получить список входов. Попробуйте обновить страницу.';});
</script>
</body>
</html>
